services:
  db:
    image: postgres:15-alpine
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_DB: notusdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234567
    ports:
      - "5433:5432"
    volumes:
      - ./.data/postgresql/data:/var/lib/postgresqldev/data
    networks:
      - naws-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: dev-pgadmin
    restart: always
    environment:
      TZ: America/Sao_Paulo
      PGADMIN_DEFAULT_EMAIL: me@example.com
      PGADMIN_DEFAULT_PASSWORD: 1234567
    ports:
      - "5050:80"
    volumes:
      - ./.data/pgadmin:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - naws-net
    
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    # Configuração própria com retenção de 6 meses (conteúdo em configs.loki-config, no fim do arquivo)
    command: -config.file=/etc/loki/loki-config.yaml
    configs:
      - source: loki-config
        target: /etc/loki/loki-config.yaml
    volumes:
      # Os logs precisam sobreviver à recriação do container para valer o prazo de 6 meses
      - loki-data:/loki
    networks:
      - naws-net
  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - naws-net

volumes:
  loki-data:

configs:
  # Configuração do Loki: a padrão da imagem grafana/loki:2.9.0 mais a retenção dos registros de
  # acesso exigida pela Política de Privacidade (seção 8) e pelo Marco Civil da Internet (Art. 15):
  # guardar por 6 meses e depois apagar.
  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h # a retenção exige índice diário

      limits_config:
        # 184 dias: cobre qualquer intervalo de 6 meses (o mais longo tem 184 dias), então nada é
        # apagado antes do prazo mínimo do Marco Civil.
        retention_period: 4416h

      compactor:
        working_directory: /loki/compactor
        shared_store: filesystem
        compaction_interval: 10m
        retention_enabled: true # sem isso o retention_period é ignorado e nada é apagado
        retention_delete_delay: 2h
        retention_delete_worker_count: 150

      ruler:
        alertmanager_url: http://localhost:9093

      # Não envia estatísticas de uso para a Grafana Labs: os logs e os metadados ficam só na
      # nossa infraestrutura, como diz a Política de Privacidade (seção 5).
      analytics:
        reporting_enabled: false

networks:
  naws-net:
    driver: bridge