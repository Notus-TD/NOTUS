# Banco de teste descartavel, separado do banco de desenvolvimento
spring.datasource.url=jdbc:h2:mem:notustestdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Nao carrega o import.sql: cada teste cria os proprios dados
spring.jpa.properties.hibernate.hbm2ddl.import_files=

# Nenhum e-mail real sai durante os testes, mesmo com RESEND_API_KEY definida na maquina
resend.api-key=
