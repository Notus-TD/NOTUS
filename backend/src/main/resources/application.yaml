spring:
  profiles:
    active: h2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: my-secret
    expiration: 3600000

# Origens que podem chamar a API pelo navegador. Inclui a rede local (192.168.x.x) para testes
# em outras máquinas; sobrescreva com a variável CORS_ALLOWED_ORIGINS (separada por vírgulas).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}

resend:
  api-key: ${RESEND_API_KEY:}
  remetente: ${RESEND_REMETENTE:NOTUS <onboarding@resend.dev>}

notificacao:
  taxa-por-segundo: ${NOTIFICACAO_TAXA_POR_SEGUNDO:20}
  max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:3}
  lote: 50
  worker-intervalo-ms: ${NOTIFICACAO_WORKER_INTERVALO_MS:600000}

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/notusdb
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.jvznbyhigagxgbihnpmx.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      schema: notus

  jpa:
    hibernate:
      ddl-auto: ${SUPABASE_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: notus
        hbm2ddl:
          create_namespaces: true
