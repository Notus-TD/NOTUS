spring:
  profiles:
    active: h2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: my-secret
    expiration: 3600000

whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  api-version: ${WHATSAPP_API_VERSION:v23.0}

notificacao:
  taxa-por-segundo: ${NOTIFICACAO_TAXA_POR_SEGUNDO:20}
  max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:3}
  lote: 50
  worker-intervalo-ms: 10000

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/notusdb
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: update
