spring:
  profiles:
    active: h2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: my-secret
    expiration: 3600000

# Origens que podem chamar a API pelo navegador. Inclui a rede local (192.168.x.x) para testes
# em outras máquinas; sobrescreva com a variável CORS_ALLOWED_ORIGINS (separada por vírgulas).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}

# Endereço do front usado nos links de convite e de redefinição de senha enviados por e-mail.
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Limite de tentativas de login erradas (contadores em memória).
  login:
    max-falhas-conta: ${LOGIN_MAX_FALHAS_CONTA:5}
    bloqueio-minutos: ${LOGIN_BLOQUEIO_MINUTOS:15}
    max-falhas-ip-por-minuto: ${LOGIN_MAX_FALHAS_IP_POR_MINUTO:20}

resend:
  api-key: ${RESEND_API_KEY:}
  remetente: ${RESEND_REMETENTE:NOTUS <onboarding@resend.dev>}
  # Só para desenvolvimento/demonstração: manda TODOS os e-mails para este endereço (vazio = desligado).
  redirecionar-para: ${RESEND_REDIRECIONAR_PARA:}

notificacao:
  taxa-por-segundo: ${NOTIFICACAO_TAXA_POR_SEGUNDO:20}
  max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:3}
  lote: 50
  worker-intervalo-ms: ${NOTIFICACAO_WORKER_INTERVALO_MS:600000}

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

# Desenvolvimento: escreve o link de senha no log (o Resend sem domínio verificado não entrega para outros e-mails).
app:
  senha:
    logar-link: true

---

spring:
  config:
    activate:
      on-profile: dev

app:
  senha:
    logar-link: true

  datasource:
    url: jdbc:postgresql://localhost:5433/notusdb
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.jvznbyhigagxgbihnpmx.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      schema: notus

  jpa:
    hibernate:
      ddl-auto: ${SUPABASE_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: notus
        hbm2ddl:
          create_namespaces: true
