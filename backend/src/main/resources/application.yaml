spring:
  profiles:
    active: h2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: my-secret
    expiration: 3600000

resend:
  api-key: ${RESEND_API_KEY:}
  # Sem domínio verificado no Resend: só onboarding@resend.dev e só entrega para o e-mail da própria conta
  remetente: ${RESEND_REMETENTE:NOTUS <onboarding@resend.dev>}

notificacao:
  taxa-por-segundo: ${NOTIFICACAO_TAXA_POR_SEGUNDO:20}
  max-tentativas: ${NOTIFICACAO_MAX_TENTATIVAS:3}
  lote: 50
  worker-intervalo-ms: ${NOTIFICACAO_WORKER_INTERVALO_MS:600000}

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/notusdb
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: update
